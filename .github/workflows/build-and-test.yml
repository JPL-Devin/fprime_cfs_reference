# Builds the F Prime CFS reference (native simulation) and runs the GDS integration tests

name: "Build and Test"

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Build and Integration Tests"
    runs-on: ubuntu-22.04
    steps:
      - name: "Make Space"
        uses: nasa/fprime-actions/make-space@devel
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Setup F´ environment"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ./libs/fprime
      - name: "Build"
        run: |
          make SIMULATION=native prep
          make
          make install
      - name: "Run Integration Tests"
        uses: nasa/fprime-actions/run-integration-tests@devel
        with:
          gds-working-directory: build-artifacts/exe/cpu1
          test-working-directory: test/int
          binary: ./core-cpu1
          binary-args: ""
          gds-args: >-
            --ip-client --ip-port 15010
            --dictionary ${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json
          pytest-args: >-
            --dictionary ${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json
      - name: "Archive logs"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfs-reference-logs
          path: build-artifacts/exe/cpu1/gds-logs
          retention-days: 5
